<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a quote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- From Uiverse.io by Yaya12085 --> 
<form class="form">
    <p class="title">Request a Quote</p>
    <p class="message">Tell us what you need, and we'll send you a quote.</p>
        <label>
            <input required="" placeholder="Firstname" type="text" class="input">
            
        </label>

        <label>
            <input required="" placeholder="Lastname" type="text" class="input">
        </label>
    
            
    <label>
        <input required="" placeholder="Email" type="email" class="input">
    </label> 
        
    <label>
        <input required="" placeholder="Phone no" type="number" class="input">
    </label>
    <label>
        <input required="" placeholder="Category" type="text" class="input">
    </label>
    <label>
        <textarea name="request a quote" class ="input" placeholder="Quote...."></textarea>
    </label>
    <button class="submit">Submit</button>
</form>
</body>
</html>
